dependenceList: []
outDir: .
miscInfo:
  uid: 36bcf0031e18a3008bbdaa10a96a7981
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - N32G430F8
        - __FPU_PRESENT
      incList:
        - ../inc
        - ../System/Core
        - ../System
        - ../firmware/inc
        - ../coremark
      libList:
        - ../src
    excludeList: []
    settings:
      debugger: cortex-debug
    toolchain: GCC
    toolchainConfigMap:
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: single
        options:
          version: 5
          afterBuildTasks:
            - name: make disasm
              abortAfterFailed: false
              command: arm-none-eabi-objdump -S ${OutDir}\${ProjectName}.elf > ${OutDir}\${ProjectName}.lst
              disable: false
          asm-compiler: {}
          beforeBuildTasks: []
          c/cpp-compiler:
            C_FLAGS: -funroll-all-loops -finline-limit=600 -ftree-dominator-opts -fno-if-conversion2 -fselective-scheduling -fno-code-hoisting -fomit-frame-pointer
            language-c: c23
            language-cpp: c++23
            no-threadsafe-statics: true
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-fast
            warnings: all-warnings
          global:
            $float-abi-type: hard
            arm-thumb-mode: thumb
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $toolName: auto
            LD_FLAGS: -Wl,--no-warn-rwx-segments
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: ../System/n32g430_flash.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: N32G430F8
          vendor: Nations
        otherCmds: ""
        proType: 1
        speed: 2000
      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: n32g430f8
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/debug.pyocd.yaml
        otherCmds: '"--pack=..\System\NSING.N32G430_DFP.1.1.1.pack"'
        speed: 4M
        targetName: n32g430f8s7
    uploader: JLink
