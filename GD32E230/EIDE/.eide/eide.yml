      OpenOCD:
        baseAddr: "0x08000000"
        bin: ""
        interface: cmsis-dap
        target: GD32E230x8
      pyOCD:
        baseAddr: "0x08000000"
        bin: ""
        config: .eide/small.pyocd.yaml
